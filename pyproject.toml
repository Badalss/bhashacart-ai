[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bhashacart-ai"
version = "0.1.0"
description = "Vernacular Shopify support and COD verification on WhatsApp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "google-genai>=1.50,<3",
    "httpx>=0.28,<1",
    "arq>=0.26.3,<1",
    "redis>=5,<6",
    "psycopg[binary,pool]>=3.2,<4",
    "opentelemetry-api>=1.32,<2",
    "opentelemetry-sdk>=1.32,<2",
    "opentelemetry-instrumentation-fastapi>=0.53b0,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.32,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
